name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  windows-account-usage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tutti-os/kimi-code-account-usage-probe test
      - name: Install and probe the packed npm helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packRoot = Join-Path $env:RUNNER_TEMP 'kimi-account-usage-pack'
          $installRoot = Join-Path $env:RUNNER_TEMP 'kimi-account-usage-install'
          New-Item -ItemType Directory -Force -Path $packRoot | Out-Null
          npm pack ./packages/account-usage-probe --pack-destination $packRoot
          $archive = @(Get-ChildItem -Path $packRoot -Filter '*.tgz')
          if ($archive.Count -ne 1) {
            throw "Expected one packed account-usage helper, found $($archive.Count)"
          }
          npm install --prefix $installRoot --no-save --no-audit --no-fund $archive[0].FullName
          $script = Join-Path $installRoot 'node_modules/@tutti-os/kimi-code-account-usage-probe/dist/cli.cjs'
          $env:KIMI_MODEL_NAME = 'windows-e2e'
          $result = (Get-Content -Raw -Encoding UTF8 $script | & node --input-type=commonjs - --output json | ConvertFrom-Json)
          if ($result.schemaVersion -ne 'tutti.agent.account-usage.v1' -or $result.outcome -ne 'available' -or $result.billingMode -ne 'api') {
            throw "Unexpected account-usage probe result: $($result | ConvertTo-Json -Compress)"
          }
